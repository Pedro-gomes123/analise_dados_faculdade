# The whole app: database, migrations + first administrator, API and front.
#   docker compose up -d --build --wait   ->  http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-vigia}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME]" &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d "$$DB_NAME"
        -Q "IF SCHEMA_ID('app') IS NULL EXEC('CREATE SCHEMA app')"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Pending migrations, then the first administrator (idempotent: does nothing
  # if one already exists). Same image as the API, compiled code.
  migrate:
    build: .
    image: vigia-back
    env_file: .env
    environment:
      DB_HOST: db
    command:
      - sh
      - -c
      - >-
        node node_modules/typeorm/cli.js migration:run -d dist/infrastructure/database/data-source.js &&
        node dist/infrastructure/database/seed-admin.cli.js
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    image: vigia-back
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  front:
    build: ../front
    ports:
      - "${FRONT_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  mssql-data:
