server {
  listen 80;
  root /usr/share/nginx/html;

  # Same contract as the Vite proxy in development: /api/... reaches the back
  # without the prefix (the trailing slash in proxy_pass removes it).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routes (TanStack Router): any unknown path loads the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
